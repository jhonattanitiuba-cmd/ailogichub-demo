<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>AILogic Hub</title>
<link rel="icon" href="/assets/logo-ai.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta name="theme-color" content="#04122b">
<link rel="stylesheet" href="/tokens.css">
<script src="/api/config"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/auth.js"></script>
<style>
:root{--bg:#04122b;--blue:#0b66ff;--blue2:#3bb0ff;--text:#dfe9ff;--muted:#8aa6d6;--font:Montserrat,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(1200px 820px at 50% 38%,#123262 0%,#0a1f42 46%,#04122b 100%);color:var(--text);font-family:var(--font);display:flex;align-items:center;justify-content:center;min-height:100vh;min-height:100dvh;padding:24px;overflow:hidden}
/* brilho azul de fundo, discreto */
.aura{position:fixed;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(59,150,255,.22),rgba(59,150,255,0) 68%);filter:blur(20px);top:34%;left:50%;transform:translate(-50%,-50%);animation:breathe 3.4s ease-in-out infinite;pointer-events:none}
@keyframes breathe{0%,100%{opacity:.55;transform:translate(-50%,-50%) scale(.94)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}}
.load{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center;width:min(460px,90vw);animation:fadeIn .5s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.msg{font-size:clamp(18px,4.5vw,24px);font-weight:700;letter-spacing:-.01em;color:#fff;min-height:30px;transition:opacity .3s}
/* sabre de luz azul: trilho + segmento brilhante varrendo */
.saber{position:relative;width:min(340px,80vw);height:3px;border-radius:999px;background:rgba(120,170,255,.14);overflow:hidden}
.saber::before{content:"";position:absolute;top:0;left:-45%;height:100%;width:42%;border-radius:999px;background:linear-gradient(90deg,transparent,var(--blue2),var(--blue),transparent);box-shadow:0 0 20px 3px rgba(59,176,255,.85);animation:sweep 1.15s cubic-bezier(.45,0,.25,1) infinite}
@keyframes sweep{0%{left:-45%}100%{left:103%}}
.sub{font-size:13px;color:var(--muted);font-weight:400;min-height:18px}
.dots{display:inline-block;width:18px;text-align:left}
@media(prefers-reduced-motion:reduce){.saber::before{animation-duration:.01s}.aura{animation:none}}
</style>
</head>
<body>
  <div class="aura"></div>
  <div class="load">
    <div class="msg" id="tip">Sincronizando sua operação</div>
    <div class="saber"></div>
    <div class="sub" id="sub">Isso leva só um instante<span class="dots" id="dots"></span></div>
  </div>
<script>
(function(){
  // gate: sem sessão -> login (não mostra a splash)
  try{ if(!(window.hubAuth && window.hubAuth.token && window.hubAuth.token())){ location.replace('/login'); return; } }catch(_){ location.replace('/login'); return; }

  var DASH='/api/dash', WA='/api/wa';
  function gj(url){ return fetch(url,{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;}); }

  // infos dinâmicas coerentes com o que o Hub carrega
  var MSGS=[
    'Sincronizando imóveis e leads',
    'Montando seu funil de negócios',
    'Conectando o atendimento no WhatsApp',
    'Reunindo os números do painel',
    'Aplicando suas permissões de acesso',
    'Preparando o Estúdio de Marketing'
  ];
  var tip=document.getElementById('tip'), i=0, done=false;
  var rot=setInterval(function(){ if(done) return; i=(i+1)%MSGS.length; tip.style.opacity='0'; setTimeout(function(){ tip.textContent=MSGS[i]; tip.style.opacity='1'; },160); },1600);
  // reticências animadas
  var d=document.getElementById('dots'), dn=0;
  var dotInt=setInterval(function(){ dn=(dn+1)%4; d.textContent='.'.repeat(dn); },420);

  // pré-carrega SÓ o que a Visão Geral consome (resumo/dash/funil/chats)
  var pre={ ts:Date.now() };
  Promise.all([
    gj(DASH+'?action=resumo').then(function(x){pre.resumo=x;}),
    gj(DASH).then(function(x){pre.dash=x;}),
    gj(DASH+'?action=funil').then(function(x){pre.funil=x;}),
    gj(WA+'?action=chats').then(function(x){pre.chats=x;})
  ]).then(function(){
    try{ sessionStorage.setItem('hub_preload', JSON.stringify(pre)); }catch(_){}
    done=true; clearInterval(dotInt); if(d) d.textContent='';
    tip.style.opacity='0'; setTimeout(function(){ tip.textContent='Tudo pronto'; tip.style.opacity='1'; var s=document.getElementById('sub'); if(s) s.textContent='Abrindo seu painel'; },160);
  }).catch(function(){});

  // tempo FIXO de 10s -> entra na Visão Geral (dados já em cache)
  setTimeout(function(){ clearInterval(rot); location.replace('/visaogeral'); }, 10000);
})();
</script>
</body>
</html>
