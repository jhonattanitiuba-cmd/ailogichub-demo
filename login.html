<style>
:root{--navy:#061936;--blue:#0b66ff;--blue2:#eaf2ff;--green:#16a56f;--gray500:#64748b;--gray300:#d9e2ef;--gray200:#edf2f7;--font:Montserrat,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box}
body,input,button,select,textarea{font-family:var(--font)}
strong,b,h1,h2,h3,.btn,label{font-weight:700}
body{margin:0;font-family:var(--font);background:#f6f9fd;color:#0f172a;min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr;overflow:hidden;transition:opacity .42s ease,transform .42s ease}
/* saida: ao entrar, a pagina inteira some antes de abrir a tela azul de loading */
body.leaving{opacity:0;transform:scale(.985);pointer-events:none}
body.leaving .brandside{transform:translateX(-24px);transition:transform .42s ease}
body.leaving .formside{transform:translateX(24px);transition:transform .42s ease}
/* painel esquerdo (marca) */
.brandside{position:relative;background:#000108;color:#e8eefb;padding:58px 62px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.glow{position:absolute;border-radius:50%;filter:blur(80px);z-index:3;mix-blend-mode:screen;pointer-events:none}
.g1{width:470px;height:470px;background:#2b7dff;top:-150px;right:-140px;animation:float1 9s ease-in-out infinite}
.g2{width:400px;height:400px;background:#1e6bff;bottom:-180px;left:-130px;animation:float2 11s ease-in-out infinite}
.g3{width:300px;height:300px;background:#3aa0ff;top:44%;left:32%;animation:float3 7.5s ease-in-out infinite}
.grid-bg{position:absolute;inset:0;z-index:1;background-image:linear-gradient(rgba(120,170,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(120,170,255,.06) 1px,transparent 1px);background-size:54px 54px;mask-image:radial-gradient(circle at 30% 26%,#000,transparent 74%)}
.bs-top,.bs-mid,.bs-bot{position:relative;z-index:1}
.brandlogo{width:min(460px,84%);height:auto;display:block;margin:0 auto;mix-blend-mode:screen;animation:logoFade 1.3s cubic-bezier(.22,.61,.36,1) .12s both}
.hero h1{font-size:40px;line-height:1.1;letter-spacing:-.03em;margin:0 0 16px;font-weight:800}
.hero p{color:#b8cdf0;font-size:15px;line-height:1.6;max-width:420px;margin:0}
.feats{display:grid;gap:14px;margin-top:30px}
.feat{display:flex;align-items:center;gap:12px;font-size:13.5px;color:#dce8ff;font-weight:500}
.feat .fi{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);display:grid;place-items:center;color:#7fb0ff}
.feat svg{width:16px;height:16px}
.bs-bot{font-size:11.5px;color:#7da2d6;letter-spacing:.04em}
/* painel direito (form) */
.formside{display:grid;place-items:center;padding:40px}
.card{width:100%;max-width:400px}
.card .head{margin-bottom:26px}
.card h2{margin:0 0 6px;font-size:26px;font-weight:800;letter-spacing:-.02em}
.card .sub{color:var(--gray500);font-size:14px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;font-weight:700;color:#334155;margin-bottom:7px}
.inp{position:relative}
.inp input{width:100%;height:50px;border:1.5px solid var(--gray300);border-radius:13px;padding:0 14px 0 44px;font:inherit;font-size:14px;color:#0f172a;background:#fff;outline:none;transition:border .15s,box-shadow .15s}
.inp input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(11,102,255,.13)}
.inp .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#94a3b8;display:grid;place-items:center}
.inp .ic svg{width:18px;height:18px}
.inp input.haseye{padding-right:46px}
.eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;background:transparent;color:#94a3b8;border-radius:9px;display:grid;place-items:center;cursor:pointer;transition:color .15s,background .15s}
.eye:hover{color:var(--blue);background:rgba(11,102,255,.08)}
.eye svg{width:18px;height:18px}
.row{display:flex;justify-content:space-between;align-items:center;margin:4px 0 22px;font-size:12.5px}
.row label{display:flex;align-items:center;gap:7px;color:#475569;cursor:pointer}
.row a{color:var(--blue);text-decoration:none;font-weight:700}
.btn{width:auto;min-width:170px;height:44px;padding:0 22px;border:0;border-radius:11px;background:linear-gradient(135deg,#0b66ff,#0a53c9);color:#fff;font:inherit;font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 8px 20px rgba(11,102,255,.24);transition:transform .12s,box-shadow .15s,filter .15s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn{transition:transform .12s,box-shadow .15s,background .2s ease}
.btn:hover{background:#000108;transform:translateY(-1px);box-shadow:0 12px 26px rgba(0,4,20,.5)}
.btn:active{transform:translateY(0)}
.btn svg{width:16px;height:16px}
/* select de acesso (demo): logins pre-carregados por grupo */
.inp select{width:100%;height:50px;border:1.5px solid var(--gray300);border-radius:13px;padding:0 40px 0 44px;font:inherit;font-size:14px;color:#0f172a;background:#fff;outline:none;-webkit-appearance:none;appearance:none;cursor:pointer;transition:border .15s,box-shadow .15s}
.inp select:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(11,102,255,.13)}
.inp .chev{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:#94a3b8;pointer-events:none}
.inp .chev svg{width:16px;height:16px}
.err{color:#e94242;font-size:12.5px;font-weight:600;margin-top:12px;min-height:16px;text-align:center}
.note{color:var(--green);font-size:12.5px;font-weight:600;margin-top:2px;text-align:center}
.note:empty{display:none}
.signup-row{margin-top:14px;text-align:center;font-size:12.5px;color:var(--gray500)}
.signup-row a{color:var(--blue);text-decoration:none;font-weight:700;cursor:pointer}
.signup-row a:hover{text-decoration:underline}
.foot{margin-top:24px;text-align:center;font-size:11.5px;color:#94a3b8}
.badge-sec{display:inline-flex;align-items:center;gap:6px;margin-top:18px;font-size:11px;color:var(--green);font-weight:700;background:#eafaf3;border:1px solid #c8efdd;padding:6px 11px;border-radius:999px}
/* botão minimalista de instalar o app */
.install-wrap{margin-top:18px;text-align:center}
.install-btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 16px;border:1.5px solid var(--gray300);border-radius:11px;background:#fff;color:#334155;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;transition:border .15s,color .15s,box-shadow .15s,background .15s}
.install-btn:hover{border-color:var(--blue);color:var(--blue);box-shadow:0 6px 16px rgba(11,102,255,.14)}
.install-btn svg{width:16px;height:16px}
/* popover de instruções para iOS */
.ios-tip{position:fixed;inset:0;z-index:50;display:none;place-items:center;background:rgba(6,25,54,.42);backdrop-filter:blur(3px);padding:20px}
.ios-tip.show{display:grid}
.ios-tip .box{max-width:320px;background:#fff;border-radius:18px;padding:24px 22px;box-shadow:0 30px 70px rgba(6,25,54,.35);text-align:center;animation:inUp .35s cubic-bezier(.22,.61,.36,1) both}
.ios-tip .box h3{margin:0 0 8px;font-size:16px;font-weight:800;color:#0f172a}
.ios-tip .box p{margin:0;font-size:13px;line-height:1.6;color:var(--gray500)}
.ios-tip .box .sh{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:10px;background:var(--blue2);color:var(--blue);margin:14px 5px 4px;vertical-align:middle}
.ios-tip .box .arw{color:#94a3b8;font-weight:800}
.ios-tip .box button{margin-top:18px;height:42px;width:100%;border:0;border-radius:12px;background:linear-gradient(135deg,#0b66ff,#074cd1);color:#fff;font:inherit;font-weight:800;font-size:13.5px;cursor:pointer}
/* animações */
@keyframes float1{0%,100%{transform:translate(0,0);opacity:.42}50%{transform:translate(-34px,36px);opacity:.62}}
@keyframes float2{0%,100%{transform:translate(0,0);opacity:.32}50%{transform:translate(32px,-26px);opacity:.5}}
@keyframes float3{0%,100%{transform:translate(0,0);opacity:.2}50%{transform:translate(24px,20px);opacity:.4}}
@keyframes logoFade{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes inUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes inLeft{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}
/* luzes azuis floam sozinhas (float1/2/3); o logo faz o fade (logoFade). Sem slide no painel. */
.card>*{animation:inUp .6s cubic-bezier(.22,.61,.36,1) both}
.card .head{animation-delay:.05s}.field.f1{animation-delay:.12s}.field.f2{animation-delay:.19s}.row{animation-delay:.26s}.btn{animation-delay:.33s}.foot{animation-delay:.4s}
/* responsivo */
@media (max-width:900px){ body{grid-template-columns:1fr} .brandside{display:none} .formside{padding:28px 20px;min-height:100vh} .card{max-width:420px} }
@media (prefers-reduced-motion: reduce){ *{animation:none !important} }
</style>
</head>
<body>
  <section class="brandside">
    <div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div>
    <div class="bs-top"><img class="brandlogo" src="/assets/logo-perfil.png" alt="AI Logic Hub"></div>
  </section>

  <section class="formside">
    <form class="card" id="form" autocomplete="off">
      <div class="head"><h2>Acessar o Hub</h2><div class="sub">Entre com suas credenciais corporativas.</div></div>
      <div class="field f1"><label for="email">E-mail corporativo</label>

  <!-- instruções de instalação para iOS (Safari não expõe prompt automático) -->
  <div class="ios-tip" id="iosTip">
    <div class="box">
      <h3>Instalar no iPhone / iPad</h3>
      <p>Toque em <span class="sh"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="m8 7 4-4 4 4"/><path d="M4 13v6a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6"/></svg></span> <span class="arw">→</span> e escolha <strong>“Adicionar à Tela de Início”</strong>.</p>

<script>
/* falha de rede ao alcançar o Supabase (projeto pausado/fora do ar, sem internet) */
function isNetErr(msg){ return /failed to fetch|networkerror|network ?error|load failed|net::|err_(internet|connection|name|network|timed)|timeout/i.test(String(msg||'')); }
var NET_MSG='Não foi possível conectar ao servidor de login. Verifique sua internet e tente novamente em instantes. Se persistir, o serviço pode estar temporariamente indisponível.';

document.getElementById('form').addEventListener('submit',async function(e){
  e.preventDefault();
  var email=document.getElementById('email').value.trim();
  var pass=document.getElementById('pass').value;
  var err=document.getElementById('err');
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ err.textContent='Informe um e-mail válido.'; return; }
  if(pass.length<4){ err.textContent='Senha muito curta.'; return; }
  err.textContent='';
  var btn=document.querySelector('.btn'); var original=btn.innerHTML; btn.textContent='Entrando...'; btn.disabled=true;
  try{
    if(!window.hubAuth) throw new Error('Config de autenticação não carregou.');
    await window.hubAuth.signIn(email,pass);
    try{ localStorage.setItem('ailogic_user',email); }catch(_){}
    document.body.classList.add('leaving');                 // some com tudo, animado
    setTimeout(function(){ location.href='/entrando'; }, 430); // depois abre a tela azul de loading
  }catch(ex){
    var msg=(ex&&ex.message)||'Falha no login.';
    if(isNetErr(msg)) msg=NET_MSG;
    else if(/invalid login|credenciais|invalid/i.test(msg)) msg='E-mail ou senha incorretos.';
    err.textContent=msg; btn.innerHTML=original; btn.disabled=false;
  }
});
</script>

<script>
/* ---- Demo: logins pre-carregados por grupo -> preenche a senha padrao ao escolher ---- */
(function(){
  var email=document.getElementById('email'), pass=document.getElementById('pass'), clr=document.getElementById('clrEmail');
  if(!email||!pass) return;
  var DEMO_PASS='AiLogicHub@2026';
  var DEMO=['diretoria','comercial','comercial-rep','juridico','financeiro','marketing'].map(function(x){return x+'@ailogichub.app';});
  function onEmail(){
    var v=email.value.trim().toLowerCase();
    if(clr) clr.style.display=v?'grid':'none';
    if(DEMO.indexOf(v)>=0) pass.value=DEMO_PASS;   // login demo -> preenche senha; e-mail novo NAO
  }
  email.addEventListener('input',onEmail); email.addEventListener('change',onEmail);
  if(clr) clr.addEventListener('click',function(){ email.value=''; pass.value=''; clr.style.display='none'; email.focus(); });
  onEmail();
  // olhinho: mostra/oculta a senha
  var eye=document.getElementById('eye');
  if(eye){ eye.addEventListener('click',function(){ var show=pass.type==='password'; pass.type=show?'text':'password'; eye.classList.toggle('on',show); eye.title=show?'Ocultar senha':'Mostrar senha'; eye.setAttribute('aria-label',eye.title); eye.innerHTML=show
    ?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 10.6a3 3 0 0 0 4.2 4.2"/><path d="M9.9 4.7A9.6 9.6 0 0 1 12 4.5c6.5 0 10 7.5 10 7.5a17 17 0 0 1-3 3.9M6.3 6.3A17 17 0 0 0 2 12s3.5 7.5 10 7.5a9.4 9.4 0 0 0 3.2-.6"/></svg>'
    :'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>'; }); }
})();
</script>

<script>
/* ---- Primeiro acesso: criar conta (Supabase signUp via anon key) ---- */
document.getElementById('signupLink').addEventListener('click',async function(e){
  e.preventDefault();
  var email=document.getElementById('email').value.trim();
  var pass=document.getElementById('pass').value;
  var err=document.getElementById('err');
  var note=document.getElementById('note');
  err.textContent=''; note.textContent='';
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ err.textContent='Preencha o e-mail para criar a conta.'; return; }
  // hub restrito: só permite auto-cadastro de e-mails corporativos @ailogichub.app
  if(!/@ailogichub\.app$/i.test(email)){ err.textContent='O primeiro acesso é só para e-mails @ailogichub.app.'; return; }
  if(pass.length<6){ err.textContent='Defina uma senha com pelo menos 6 caracteres.'; return; }
  var link=this; var orig=link.textContent; link.textContent='Criando...'; link.style.pointerEvents='none';
  try{
    if(!window.hubAuth) throw new Error('Config de autenticação não carregou.');
    var data=await window.hubAuth.signUp(email,pass);
    if(data && data.session){
      // confirmação de e-mail desligada → já autenticado
      try{ localStorage.setItem('ailogic_user',email); }catch(_){}
      location.href='/entrando'; return;
    }
    // sem sessão → Supabase exige confirmação por e-mail
    note.textContent='Conta criada. Confirme pelo link enviado para '+email+' e depois entre.';
  }catch(ex){
    var msg=(ex&&ex.message)||'Não foi possível criar a conta.';
    if(isNetErr(msg)) msg=NET_MSG;
    else if(/not allowed|disabled|signup/i.test(msg)) msg='Auto-cadastro desativado no servidor. Peça a criação do usuário a quem administra o Supabase.';
    else if(/already registered|already been registered|exists/i.test(msg)) msg='Esse e-mail já tem conta. Use "Entrar no Hub".';
    else if(/password/i.test(msg)) msg='Senha fraca demais para o servidor. Tente uma senha mais forte.';
    err.textContent=msg;
  }finally{
    link.textContent=orig; link.style.pointerEvents='';
  }
});
</script>

<script>
/* ---- Esqueci a senha: envia link de redefinição ---- */
document.getElementById('forgotLink').addEventListener('click',async function(e){
  e.preventDefault();
  var email=document.getElementById('email').value.trim();
  var err=document.getElementById('err');
  var note=document.getElementById('note');
  err.textContent=''; note.textContent='';
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ err.textContent='Digite seu e-mail no campo acima para redefinir a senha.'; return; }
  var link=this; var orig=link.textContent; link.textContent='Enviando...'; link.style.pointerEvents='none';
  try{
    if(!window.hubAuth) throw new Error('Config de autenticação não carregou.');
    await window.hubAuth.resetPassword(email);
    note.textContent='Se existir uma conta para '+email+', enviamos um link de redefinição. Verifique seu e-mail (e o spam).';
  }catch(ex){
    var msg=(ex&&ex.message)||'Não foi possível enviar o link.';
    if(isNetErr(msg)) msg=NET_MSG;
    else if(/rate|too many|seconds/i.test(msg)) msg='Aguarde um instante antes de pedir outro link.';
    err.textContent=msg;
  }finally{
    link.textContent=orig; link.style.pointerEvents='';
  }
});
</script>

<script>
/* ---- Instalação do app (PWA) ---- */
(function(){
  var wrap=document.getElementById('installWrap');
