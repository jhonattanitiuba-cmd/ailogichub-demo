<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Logic Hub · Ficha de Visita</title>
<link rel="icon" type="image/png" href="/assets/favicon.png"><link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{--ink:#12203a;--blue:#0f8bff;--blue2:#0748bb;--night:#000108;--line:#dbe3ee;--muted:#5a6b84;--paper:#eef2f7}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Source Serif 4",Georgia,serif;line-height:1.6;font-size:14px}
.bar{position:sticky;top:0;z-index:20;background:var(--night);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px clamp(14px,4vw,34px);box-shadow:0 6px 24px rgba(0,1,8,.25)}
.bar img{height:26px;width:auto;object-fit:contain;display:block}
.bar .acts{display:flex;gap:9px}
.bar button{font-family:Montserrat,Arial,sans-serif;font-weight:700;font-size:12.5px;border:0;border-radius:10px;padding:9px 15px;cursor:pointer;transition:transform .12s,filter .15s}
.bar button:hover{transform:translateY(-1px)}
.bar .print{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff}
.bar .ghost{background:transparent;color:#cfe2ff;border:1px solid #24406a}
.wrap{padding:26px 14px 60px;display:flex;justify-content:center}
.sheet{width:820px;max-width:100%;background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 24px 60px rgba(15,32,58,.14)}
.head{position:relative;padding:30px 46px 18px;border-bottom:3px solid var(--blue)}
.head::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:3px;background:linear-gradient(90deg,var(--blue),transparent)}
.head-row{display:flex;align-items:center;justify-content:space-between;gap:16px}
.head img{height:44px;width:auto;object-fit:contain}
.head .meta{font-family:Montserrat,Arial,sans-serif;text-align:right;font-size:10.5px;color:var(--muted);line-height:1.5}
.head .meta b{color:var(--ink)}
.doc{padding:26px 46px 40px}
.doc h1{font-family:Montserrat,Arial,sans-serif;font-size:17px;letter-spacing:.01em;text-align:center;margin:6px 0 4px;color:var(--ink);text-transform:uppercase}
.doc .prot{font-family:Montserrat,Arial,sans-serif;text-align:center;color:var(--muted);font-size:10.5px;letter-spacing:.06em;margin-bottom:20px;text-transform:uppercase}
.doc h2{font-family:Montserrat,Arial,sans-serif;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--blue2);margin:22px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--line)}
.doc p{margin:0 0 11px;text-align:justify}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:2px 26px;margin:4px 0 8px;font-size:13.5px}
.grid .f{padding:7px 0;border-bottom:1px solid #eef2f7}
.grid .f span{display:block;font-family:Montserrat,Arial,sans-serif;font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:1px}
.grid .f b{font-weight:600}
.grid .full{grid-column:1/-1}
.slotcard{background:#f3f8ff;border:1px solid #dcebff;border-radius:10px;padding:13px 16px;margin:10px 0 6px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center}
.slotcard .big{font-family:Montserrat,Arial,sans-serif;font-weight:800;font-size:19px;color:var(--blue2)}
.slotcard small{font-family:Montserrat,Arial,sans-serif;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.05em;display:block}
.clause{margin:0 0 11px;text-align:justify}
.clause b.n{font-family:Montserrat,Arial,sans-serif;color:var(--blue2)}
.sign{display:grid;grid-template-columns:1fr 1fr;gap:34px;margin-top:40px}
.sign .b{text-align:center}
.sign .ln{border-top:1.5px solid var(--ink);margin-bottom:6px}
.sign .nm{font-family:Montserrat,Arial,sans-serif;font-weight:700;font-size:12.5px}
.sign .rl{font-family:Montserrat,Arial,sans-serif;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.stamp{margin-top:30px;border:1px dashed #bcd3f0;border-radius:12px;background:#f7fbff;padding:14px 16px;display:flex;align-items:center;gap:14px}
.stamp .seal{flex:0 0 auto;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--night));color:#fff;display:grid;place-items:center}
.stamp .seal svg{width:26px;height:26px}
.stamp .txt{font-family:Montserrat,Arial,sans-serif;font-size:11px;color:var(--muted);line-height:1.55}
.stamp .txt b{color:var(--ink);font-size:12px;display:block;margin-bottom:2px}
.stamp .txt code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;color:var(--blue2);background:#eaf3ff;padding:1px 6px;border-radius:5px}
.foot{padding:16px 46px 30px;border-top:1px solid var(--line);font-family:Montserrat,Arial,sans-serif;font-size:10px;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.foot b{color:var(--ink)}
@media(max-width:640px){.head,.doc,.foot{padding-left:20px;padding-right:20px}.grid,.sign{grid-template-columns:1fr}}
@media print{@page{size:A4;margin:16mm 0}body{background:#fff}.bar{display:none}.wrap{padding:0}.sheet{width:auto;border:0;border-radius:0;box-shadow:none}.head{padding-top:0}.doc{padding:16px 18mm}.head,.foot{padding-left:18mm;padding-right:18mm}.stamp,.slotcard,.sign{break-inside:avoid}}
</style>
</head>
<body>
<div class="bar">
  <div><img src="/assets/logo-horizontal.png" alt="AI Logic Hub"></div>
  <div class="acts"><button class="ghost" onclick="history.length>1?history.back():location.href='/imoveis'">Voltar</button><button class="print" onclick="window.print()">Imprimir / Salvar PDF</button></div>
</div>
<div class="wrap"><div class="sheet">
  <div class="head"><div class="head-row">
    <img src="/assets/logo-horizontal.png" alt="AI Logic Hub">
    <div class="meta"><b>Plataforma AI Logic Hub</b><br>Inteligência que conecta<br>Ficha nº <span id="mDoc">·</span><br>Emitida em <span id="mData">·</span></div>
  </div></div>
  <div class="doc" id="doc"><p style="text-align:center;color:var(--muted)">Carregando ficha...</p></div>
  <div class="foot">
    <div><b>AI Logic Hub</b> · Plataforma de intermediação imobiliária · ailogichub.app</div>
    <div>Documento gerado eletronicamente · <span id="fDoc">·</span></div>
  </div>
</div></div>
<script>
(function(){
  var q=new URLSearchParams(location.search);
  function esc(s){return String(s==null?'':s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
  var cli=null;try{cli=JSON.parse(localStorage.getItem('ail_cliente')||'null');}catch(_){}
  var d=new Date();
  var meses=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  var dataExt=d.getDate()+' de '+meses[d.getMonth()]+' de '+d.getFullYear();
  var docNum='VIS-'+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+'-'+Math.random().toString(36).slice(2,7).toUpperCase();
  var verif=(Math.random().toString(36).slice(2,6)+Math.random().toString(36).slice(2,6)).toUpperCase();
  document.getElementById('mDoc').textContent=docNum;
  document.getElementById('fDoc').textContent=docNum;
  document.getElementById('mData').textContent=dataExt;

  var cod=q.get('cod')||'';
  var cliente=q.get('cliente')||(cli&&cli.nome)||'A ser identificado';
  var whats=q.get('whatsapp')||(cli&&cli.whatsapp)||'';
  var dia=q.get('dia')||'A confirmar';
  var hora=q.get('hora')||'';

  fetch('/api/vitrine',{cache:'no-store'}).then(function(r){return r.json();}).then(function(j){
    var rows=(j&&j.rows)||[];
    var im=rows.filter(function(x){return String(x.codigo||'').toLowerCase()===cod.toLowerCase();})[0]||rows[0]||{};
    render(im);
  }).catch(function(){render({});});

  function render(im){
    var titulo=im.titulo||'Imóvel';
    var local=[im.bairro,im.cidade].filter(Boolean).join(', ')||'Localização a confirmar';
    var end=im.endereco||(im.extra&&im.extra.endereco)||'Endereço conforme cadastro';
    var codigo=im.codigo||'—';
    var imob=(im.imobiliaria&&(im.imobiliaria.nome||im.imobiliaria))||'Imobiliária responsável';
    var quando=hora?(dia+' às '+hora):dia;

    var html=''
    +'<h1>Ficha de Visita ao Imóvel</h1>'
    +'<div class="prot">Ficha nº '+esc(docNum)+' · gerada pela plataforma AI Logic Hub</div>'

    +'<div class="slotcard"><div><small>Visita agendada para</small><span class="big">'+esc(quando)+'</span></div><div style="font-family:Montserrat,Arial,sans-serif;color:var(--muted);font-size:11px;text-align:right">Confirmação pelo WhatsApp</div></div>'

    +'<h2>Dados da visita</h2>'
    +'<div class="grid">'
      +'<div class="f"><span>Cliente</span><b>'+esc(cliente)+'</b></div>'
      +'<div class="f"><span>Contato</span><b>'+esc(whats||'A informar')+'</b></div>'
      +'<div class="f full"><span>Imóvel</span><b>'+esc(titulo)+'</b></div>'
      +'<div class="f"><span>Localização</span><b>'+esc(local)+'</b></div>'
      +'<div class="f"><span>Código</span><b>'+esc(codigo)+'</b></div>'
      +'<div class="f full"><span>Endereço</span><b>'+esc(end)+'</b></div>'
      +'<div class="f"><span>Imobiliária</span><b>'+esc(imob)+'</b></div>'
      +'<div class="f"><span>Plataforma</span><b>AI Logic Hub</b></div>'
    +'</div>'

    +'<div id="handoff"></div>'
    +'<h2>Termo de visita</h2>'
    +'<p class="clause"><b class="n">1.</b> O cliente confirma o interesse em visitar o imóvel acima, no horário agendado, com o acompanhamento do corretor responsável indicado pela plataforma.</p>'
    +'<p class="clause"><b class="n">2.</b> Esta ficha, assinada digitalmente, registra o vínculo do atendimento: <b>o negócio referente a este imóvel fica associado ao corretor que realizar esta visita</b>, preservando a rede de parceiros e evitando conflito de atendimento.</p>'
    +'<p class="clause"><b class="n">3.</b> Os dados informados seguem a política de privacidade e a LGPD, sendo usados apenas para a condução desta visita e da eventual negociação.</p>'
    +'<p style="margin-top:14px">Assim registrado, as partes seguem para a visita em '+esc(dataExt)+'.</p>'

    +'<div class="sign">'
      +'<div class="b"><div class="ln"></div><div class="nm">'+esc(cliente)+'</div><div class="rl">Cliente visitante</div></div>'
      +'<div class="b"><div class="ln"></div><div class="nm">'+esc(imob)+'</div><div class="rl">Corretor responsável</div></div>'
    +'</div>'

    +'<div class="stamp"><div class="seal"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div>'
      +'<div class="txt"><b>Ficha assinada digitalmente</b>Registro eletrônico com validade para vincular o atendimento ao corretor da visita. Código de verificação: <code>'+esc(verif)+'</code></div></div>';

    document.getElementById('doc').innerHTML=html;
    document.title='Ficha de Visita · '+titulo+' · AI Logic Hub';
    carregarHandoff();
  }
  function carregarHandoff(){
    var conv=null;try{conv=JSON.parse(localStorage.getItem('ail_atendimento')||'null');}catch(_){}
    if(!conv||!conv.length)return;
    fetch('/api/sam-web?action=resumo',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:conv})}).then(function(r){return r.json();}).then(function(h){
      if(!h||(!h.resumo&&!h.perfil&&!(h.checklist&&h.checklist.length)))return;
      var el=document.getElementById('handoff');if(!el)return;
      var chk=(h.checklist||[]).map(function(x){return '<li style="margin:2px 0">'+esc(x)+'</li>';}).join('');
      el.innerHTML='<h2>Passagem do atendimento</h2>'
        +((h.perfil||h.score!=null)?'<div class="grid">'+(h.perfil?'<div class="f"><span>Perfil do cliente</span><b>'+esc(h.perfil)+'</b></div>':'')+(h.score!=null?'<div class="f"><span>Grau de qualificação</span><b>'+Number(h.score).toFixed(1)+' / 10</b></div>':'')+'</div>':'')
        +(chk?'<p style="margin:8px 0 4px;font-family:Montserrat,Arial,sans-serif;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)">Checklist da visita (critérios do cliente)</p><ul style="margin:0 0 10px;padding-left:18px">'+chk+'</ul>':'')
        +(h.resumo?'<p class="clause">'+esc(h.resumo)+'</p>':'');
    }).catch(function(){});
  }
})();
</script>
</body>
</html>
