<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AILogic Hub · Imóvel</title><link rel="icon" type="image/png" href="/assets/favicon.png"><link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<style>
:root{--ink:#0d1b2f;--blue:#0f8bff;--blue2:#0748bb;--ice:#f5f8fc;--line:#e3e9f0;--muted:#5b6b82;--night:#061326}
*{box-sizing:border-box}body{margin:0;background:var(--ice);color:var(--ink);font-family:Inter,Montserrat,Arial,sans-serif;line-height:1.5}
img{display:block;max-width:100%}
.top{display:flex;align-items:center;gap:10px;padding:16px clamp(16px,4vw,40px);background:#000108;color:#fff}
.top img{width:34px;height:34px;object-fit:contain}
.top b{font-weight:800}.top b span{color:#4cc6ff}
.wrap{max-width:1000px;margin:0 auto;padding:clamp(16px,3vw,32px)}
.gal{border-radius:20px;overflow:hidden;background:var(--night);position:relative;aspect-ratio:16/10}
.gal img{width:100%;height:100%;object-fit:cover}
.ph{width:100%;height:100%;display:grid;place-items:center;background:linear-gradient(135deg,var(--blue),var(--night));color:#ffffffcc;font-weight:700}
.thumbs{display:flex;gap:8px;margin-top:10px;overflow:auto}
.thumbs img{width:88px;height:64px;object-fit:cover;border-radius:10px;cursor:pointer;opacity:.65;border:2px solid transparent}
.thumbs img.on{opacity:1;border-color:var(--blue)}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:end;margin:22px 0 6px}
h1{font-size:clamp(24px,4vw,34px);margin:0;letter-spacing:-.02em}
.loc{color:var(--muted);margin-top:4px}
.price{font-size:clamp(26px,4vw,34px);font-weight:800;color:var(--blue)}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.tag{font-size:12px;font-weight:700;padding:6px 11px;border-radius:999px;background:#e7f2ff;color:var(--blue)}
.specs{display:flex;flex-wrap:wrap;gap:20px;margin:16px 0;padding:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.specs div{font-size:14px}.specs span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.desc{color:#38465a;margin:16px 0}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.btn{padding:16px;border:0;border-radius:14px;font-weight:800;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .1s,filter .15s}
.btn:active{transform:scale(.98)}
.btn.p{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff}
.btn.v{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
.btn:hover{filter:brightness(1.05)}
.panel{margin-top:16px;border:1px solid var(--line);border-radius:16px;background:#fff;padding:20px;display:none}
.panel.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.panel h3{margin:0 0 4px;font-size:19px}
.panel .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
label{display:block;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.05em;margin:10px 0 5px;text-transform:uppercase}
input{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;background:#f7f9fc;font-size:15px}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:6px}
.slot{padding:12px 8px;border:1px solid var(--line);border-radius:12px;background:#f7f9fc;cursor:pointer;text-align:center;font-size:13px;font-weight:700;transition:.12s}
.slot span{display:block;font-size:11px;color:var(--muted);font-weight:600}
.slot.on{background:var(--blue);color:#fff;border-color:var(--blue)}.slot.on span{color:#dbeafe}
.ok{padding:16px;border-radius:12px;background:#e6f7ee;color:#0a7d43;font-weight:700;margin-top:14px;display:none}
.ok.on{display:block}
.foot{color:var(--muted);font-size:12px;text-align:center;padding:30px 0}
@media(max-width:640px){.actions{grid-template-columns:1fr}.gal{aspect-ratio:4/3}}

/* imovel social */
.top .logo-h{height:30px;width:auto;object-fit:contain}
.ctabar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:11px clamp(16px,4vw,40px);background:#050c17;border-bottom:1px solid rgba(255,255,255,.08)}
.ctabar button{text-transform:uppercase;letter-spacing:.04em;font-weight:800;font-size:12px;padding:11px 16px;border-radius:999px;cursor:pointer;border:1px solid var(--blue);background:transparent;color:#cfe6ff;transition:.15s;font-family:inherit}
.ctabar button:hover{background:var(--blue);color:#fff}
.ctabar button[data-cta=proposta]{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;border-color:transparent}
.ctabar .who{margin-left:auto;color:#8fb7e6;font-size:12px;font-weight:700}
.btn{text-transform:uppercase;letter-spacing:.03em}
.social{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 0}
.social button{display:flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:9px 15px;font-weight:700;font-size:13px;cursor:pointer;color:var(--ink);transition:.15s;font-family:inherit}
.social button:hover{border-color:var(--blue);color:var(--blue)}
.social button.on{background:#ffe9ef;border-color:#ff4d6d;color:#ff4d6d}
.social svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8}
.inst{background:#050c17;color:#8f9aa6;padding:26px clamp(16px,4vw,40px);font-size:12px;line-height:1.7;border-top:1px solid rgba(255,255,255,.08)}
.inst img{height:28px;width:auto;margin-bottom:10px}
.inst b{color:#cfe0f2}
@media(max-width:640px){.ctabar .who{width:100%;margin:4px 0 0}}

/* gal social */
.gal{position:relative}
.gal-rail{position:absolute;right:16px;bottom:18px;z-index:4;display:flex;flex-direction:column;gap:15px}
.gal-rail button{background:none;border:0;color:#fff;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;font-family:inherit}
.gal-rail .ic{width:48px;height:48px;border-radius:50%;background:rgba(6,16,26,.5);border:1px solid rgba(255,255,255,.32);display:grid;place-items:center;backdrop-filter:blur(5px);transition:.15s}
.gal-rail button:hover .ic{background:rgba(15,139,255,.85);border-color:transparent;transform:translateY(-2px)}
.gal-rail svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:1.8}
.gal-rail small{font-size:11px;font-weight:700;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.gal-rail button.on .ic{background:#ff4d6d;border-color:#ff4d6d}
.gal-rail button.on svg{fill:#fff;stroke:#fff}
.gal-rail button.pop .ic{animation:heartpop .4s ease}
.social button.on svg{fill:#ff4d6d;stroke:#ff4d6d}
@keyframes heartpop{0%{transform:scale(1)}40%{transform:scale(1.3)}100%{transform:scale(1)}}
@media(max-width:640px){.gal-rail{right:10px;bottom:12px;gap:10px}.gal-rail .ic{width:42px;height:42px}}
</style>
</head>
<body>
<header class="top"><img class="logo-h" src="/assets/logo-horizontal.png" alt="AILogic Hub"></header>
<div class="ctabar" id="ctabar"><button data-cta="duvidas">Tirar dúvidas</button><button data-cta="visita">Agendar visita</button><button data-cta="proposta">Fazer proposta</button><span class="who" id="who"></span></div>
<div class="wrap" id="wrap"><p style="color:var(--muted)">Carregando imóvel...</p></div>
<footer class="inst"><img src="/assets/logo-horizontal.png" alt="AILogic Hub"><div><b>AILogic Hub</b> · Inteligência que conecta o mercado imobiliário.</div><div>© 2026 AILogic Hub. Todos os direitos reservados.</div><div>Este canal é informativo. As negociações são conduzidas pelos parceiros credenciados do Hub.</div></footer>
<script>
(function(){
  var cod=new URLSearchParams(location.search).get('cod')||'';
  function getCli(){try{return JSON.parse(localStorage.getItem('ail_cliente')||'null');}catch(e){return null;}}
  function brl(v){return v==null?'Sob consulta':'R$ '+Math.round(v).toLocaleString('pt-BR');}
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  fetch('/api/vitrine',{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){
    var rows=(d&&d.rows)||[];
    var p=rows.filter(function(x){return String(x.codigo||'').toLowerCase()===cod.toLowerCase();})[0]||rows[0];
    if(!p){document.getElementById('wrap').innerHTML='<p>Imóvel não encontrado.</p>';return;}
    render(p);
  }).catch(function(){document.getElementById('wrap').innerHTML='<p>Não foi possível carregar.</p>';});

  function render(p){
    var fotos=(p.fotos&&p.fotos.length?p.fotos:(p.foto?[p.foto]:[]));
    var facts=[];
    if(p.area)facts.push(['Área',p.area+' m²']);
    if(p.quartos)facts.push(['Quartos',p.quartos]);
    if(p.suites)facts.push(['Suítes',p.suites]);
    if(p.vagas)facts.push(['Vagas',p.vagas]);
    if(p.banheiros)facts.push(['Banheiros',p.banheiros]);
    var fin=(p.finalidade||'').toLowerCase()==='locacao'?'Locação':(p.finalidade||'').toLowerCase()==='temporada'?'Temporada':'Venda';
    var gal=fotos.length?'<img id="big" src="'+esc(fotos[0])+'" alt="">':'<div class="ph">Foto em breve</div>';
    var th=fotos.length>1?'<div class="thumbs">'+fotos.map(function(f,i){return '<img class="'+(i===0?'on':'')+'" data-i="'+i+'" src="'+esc(f)+'">';}).join('')+'</div>':'';
    document.getElementById('wrap').innerHTML=
      '<div class="gal">'+gal+'<div class="gal-rail"><button data-s="save" aria-label="Salvar"><span class="ic"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.5-8.6C1 9 3 6 6 6c2 0 3 1 4 2 1-1 2-2 4-2 3 0 5 3 3.5 6.4C19.5 16.4 12 21 12 21z"/></svg></span><small>Salvar</small></button><button data-s="sam" aria-label="Perguntar ao Sam"><span class="ic"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 3z"/></svg></span><small>Sam</small></button><button data-s="share" aria-label="Enviar"><span class="ic"><svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="2.4"/><circle cx="18" cy="6" r="2.4"/><circle cx="18" cy="18" r="2.4"/><path d="M8 11l8-4M8 13l8 4"/></svg></span><small>Enviar</small></button></div>'+'</div>'+th+'<div class="social"><button data-s="save"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.5-8.6C1 9 3 6 6 6c2 0 3 1 4 2 1-1 2-2 4-2 3 0 5 3 3.5 6.4C19.5 16.4 12 21 12 21z"/></svg>Salvar</button><button data-s="sam"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 3z"/></svg>Perguntar ao Sam</button><button data-s="share"><svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="2.4"/><circle cx="18" cy="6" r="2.4"/><circle cx="18" cy="18" r="2.4"/><path d="M8 11l8-4M8 13l8 4"/></svg>Compartilhar</button></div>'+
      '<div class="head"><div><h1>'+esc(p.titulo||'Imóvel')+'</h1><div class="loc">'+esc([p.bairro,p.cidade].filter(Boolean).join(', '))+'</div></div><div class="price">'+brl(p.preco)+'</div></div>'+
      '<div class="tags"><span class="tag">'+fin+'</span>'+(p.tipo?'<span class="tag">'+esc(p.tipo)+'</span>':'')+(p.codigo?'<span class="tag">Cód. '+esc(p.codigo)+'</span>':'')+'</div>'+
      '<div class="specs">'+facts.map(function(f){return '<div><span>'+f[0]+'</span>'+f[1]+'</div>';}).join('')+'</div>'+
      (p.descricao?'<p class="desc">'+esc(p.descricao)+'</p>':'')+
      '<div class="actions"><button class="btn p" id="bp">Fazer proposta e assinatura</button><button class="btn v" id="bv">Agendar uma visita</button></div>'+
      '<div class="panel" id="pp"><h3>Proposta e assinatura digital</h3><div class="sub">Preencha e o Hub gera o documento para assinatura digital via Google.</div>'+
        '<label>Seu nome</label><input id="pn" placeholder="Nome completo"><label>WhatsApp</label><input id="pw" placeholder="(11) 90000-0000"><label>Valor da sua proposta</label><input id="pv" placeholder="R$">'+
        '<button class="btn p" style="margin-top:14px" id="penv">Gerar proposta e contrato</button><div class="ok" id="pok">Proposta registrada. Abrimos o contrato timbrado do Hub para conferência e, na sequência, você recebe o link de assinatura digital por WhatsApp.</div></div>'+
      '<div class="panel" id="vp"><h3>Agende uma visita</h3><div class="sub">Escolha um horário disponível. A confirmação chega no seu WhatsApp.</div><div class="slots" id="slots"></div>'+
        '<div class="ok" id="vok"></div></div>';
    wire(p,fotos);
  }

  function wire(p,fotos){
    var cli=getCli();var who=document.getElementById('who');if(cli&&who)who.textContent='Conectado: '+cli.nome;
    // galeria
    document.querySelectorAll('.thumbs img').forEach(function(t){t.addEventListener('click',function(){document.getElementById('big').src=t.src;document.querySelectorAll('.thumbs img').forEach(function(x){x.classList.toggle('on',x===t);});});});
    // paineis
    var pp=document.getElementById('pp'),vp=document.getElementById('vp');
    document.getElementById('bp').addEventListener('click',function(){vp.classList.remove('on');pp.classList.toggle('on');pp.scrollIntoView({behavior:'smooth',block:'center'});});
    document.getElementById('bv').addEventListener('click',function(){pp.classList.remove('on');vp.classList.toggle('on');vp.scrollIntoView({behavior:'smooth',block:'center'});});
    document.getElementById('penv').addEventListener('click',function(){
      document.getElementById('pok').classList.add('on');
      var nm=(document.getElementById('pn').value||'').trim();
      var wp=(document.getElementById('pw').value||'').trim();
      var vl=(document.getElementById('pv').value||'').replace(/[^\d]/g,'');
      var u='/contrato?cod='+encodeURIComponent(cod||(p&&p.codigo)||'')+(nm?'&cliente='+encodeURIComponent(nm):'')+(wp?'&whatsapp='+encodeURIComponent(wp):'')+(vl?'&valor='+encodeURIComponent(vl):'');
      window.open(u,'_blank','noopener');
    });
    // blocos de horario
    var dias=['Amanhã','Depois'],horas=['09:00','11:00','14:00','16:00'],slots=document.getElementById('slots');
    dias.forEach(function(dia){horas.forEach(function(h){var s=document.createElement('button');s.className='slot';s.innerHTML=h+'<span>'+dia+'</span>';s.addEventListener('click',function(){document.querySelectorAll('.slot').forEach(function(x){x.classList.remove('on');});s.classList.add('on');var ok=document.getElementById('vok');ok.textContent='Visita solicitada para '+dia.toLowerCase()+' às '+h+'. Geramos sua ficha de visita assinada e a confirmação chega pelo WhatsApp.';ok.classList.add('on');var nm=((document.getElementById('pn')||{}).value||'').trim();var wp=((document.getElementById('pw')||{}).value||'').trim();var u='/ficha-visita?cod='+encodeURIComponent(cod||(p&&p.codigo)||'')+'&dia='+encodeURIComponent(dia)+'&hora='+encodeURIComponent(h)+(nm?'&cliente='+encodeURIComponent(nm):'')+(wp?'&whatsapp='+encodeURIComponent(wp):'');window.open(u,'_blank','noopener');});slots.appendChild(s);});});
    var cli2=getCli();if(cli2){var pn=document.getElementById('pn'),pw=document.getElementById('pw');if(pn)pn.value=cli2.nome;if(pw)pw.value=cli2.whatsapp;}
    var wa='https://wa.me/5511936238387?text='+encodeURIComponent('Quero tirar dúvidas sobre '+(p.titulo||'')+' ['+(p.codigo||cod)+']');
    var cbar=document.getElementById('ctabar');if(cbar)cbar.querySelectorAll('[data-cta]').forEach(function(b){b.addEventListener('click',function(){var k=b.getAttribute('data-cta');if(k==='duvidas'){window.open(wa,'_blank','noopener');}else if(k==='visita'){pp.classList.remove('on');vp.classList.add('on');vp.scrollIntoView({behavior:'smooth',block:'center'});}else if(k==='proposta'){vp.classList.remove('on');pp.classList.add('on');pp.scrollIntoView({behavior:'smooth',block:'center'});}});});
    document.querySelectorAll('.social [data-s], .gal-rail [data-s]').forEach(function(b){b.addEventListener('click',function(){var k=b.getAttribute('data-s');if(k==='save'){var was=b.classList.contains('on');document.querySelectorAll('[data-s="save"]').forEach(function(x){x.classList.toggle('on',!was);if(!was)x.classList.add('pop');});setTimeout(function(){document.querySelectorAll('.pop').forEach(function(x){x.classList.remove('pop');});},400);}else if(k==='sam'){window.open(wa,'_blank','noopener');}else if(k==='share'){var u=location.origin+'/imovel?cod='+encodeURIComponent(cod||(p&&p.codigo)||'');try{if(navigator.clipboard)navigator.clipboard.writeText(u);}catch(e){}var o=b.innerHTML;b.innerHTML='Link copiado';setTimeout(function(){b.innerHTML=o;},1600);}});});
  }
})();
</script>
</body>
</html>
